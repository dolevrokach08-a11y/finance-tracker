name: Bank of Israel Average Rates

# Manual only for now, on purpose. The Bank's site sits behind bot protection and a
# runner's IP is not a browser's — the same thing that pushed the price fetcher off
# yahoo-finance2 and onto the Worker. A cron added before the download is known to work
# from a runner would fail silently once a month, which is worse than no cron at all.
# Add the schedule once a manual run has passed:
#   schedule:
#     - cron: '0 5 12 * *'   # the Bank publishes mid-month
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The runner image does not reliably carry LibreOffice, and the fetch script needs
      # it to convert the Bank's .xls. calc alone is enough and installs faster than the
      # full suite.
      - name: Ensure LibreOffice Calc
        run: |
          if command -v soffice >/dev/null 2>&1; then
            echo "soffice already present: $(soffice --version)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
            echo "installed: $(soffice --version)"
          fi

      - name: Fetch the published rates
        run: node tools/fetch-boi-rates.mjs

      - name: Show what changed
        run: |
          if git diff --quiet -- data/boi-mortgage-rates.json; then
            echo "No new publication — the table is already current."
          else
            git --no-pager diff --stat -- data/boi-mortgage-rates.json
            node -e "
              const d = JSON.parse(require('fs').readFileSync('data/boi-mortgage-rates.json','utf8'));
              console.log('newest row:', d.rows[0].from, JSON.stringify(d.rows[0].rates));
            "
          fi

      - name: Verify the table still satisfies its tests
        run: node tests/boi-rates.test.mjs

      - name: Commit a new publication
        run: |
          if git diff --quiet -- data/boi-mortgage-rates.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEWEST=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/boi-mortgage-rates.json','utf8')).rows[0].from)")
          git add data/boi-mortgage-rates.json
          git commit -m "Refresh the Bank of Israel average rates through $NEWEST

          Generated by tools/fetch-boi-rates.mjs from the Bank's published .xls.
          The early-repayment fee reads its two rate inputs out of this file."
          git push
