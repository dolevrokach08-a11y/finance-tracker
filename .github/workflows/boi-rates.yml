name: Bank of Israel Average Rates

# Scheduled only after a manual run proved the whole path from a runner, and that caution
# earned its keep: the download worked first time, the parse did not. The .xls was being
# converted through LibreOffice back then, which formats dates in the machine's locale, so
# the runner read the same workbook month-first and built a table sorted around a
# publication dated "2026-21-04". A cron added on day one would have been rewriting the
# rates wrongly, once a month, in silence. The workbook is now read directly and the job
# needs nothing but Node.
#
# The Bank has published between the 11th and the 21st over the past two years. Two
# attempts cover that: the 16th catches an early publication within days, the 23rd is the
# backstop. A run with nothing new to fetch commits nothing.
on:
  schedule:
    - cron: '0 5 16 * *'
    - cron: '0 5 23 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the published rates
        run: node tools/fetch-boi-rates.mjs

      - name: Show what changed
        run: |
          if git diff --quiet -- data/boi-mortgage-rates.json; then
            echo "No new publication — the table is already current."
          else
            git --no-pager diff --stat -- data/boi-mortgage-rates.json
            node -e "
              const d = JSON.parse(require('fs').readFileSync('data/boi-mortgage-rates.json','utf8'));
              console.log('newest row:', d.rows[0].from, JSON.stringify(d.rows[0].rates));
            "
          fi

      - name: Verify the table still satisfies its tests
        run: node tests/boi-rates.test.mjs

      - name: Commit a new publication
        run: |
          if git diff --quiet -- data/boi-mortgage-rates.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEWEST=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/boi-mortgage-rates.json','utf8')).rows[0].from)")
          git add data/boi-mortgage-rates.json
          git commit -m "Refresh the Bank of Israel average rates through $NEWEST

          Generated by tools/fetch-boi-rates.mjs from the Bank's published .xls.
          The early-repayment fee reads its two rate inputs out of this file."
          git push
