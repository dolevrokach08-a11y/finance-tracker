# The repo already carries its own checks; until now nothing ran them except a
# pre-commit hook that only exists in clones where someone remembered to run
# `git config core.hooksPath tools/hooks`. It was not armed in a worktree
# created during this project, and a stale generated file went unnoticed as a
# result. main deploys straight to GitHub Pages, so a bad commit is live.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The invariant step compares against the previous commit, which a
          # depth-1 checkout does not have.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Only tools/ has dependencies (babel, for the tax bundle). The app itself
      # has none — it ships as plain files.
      - name: Install build tooling
        run: npm --prefix tools ci

      # The two committed build outputs must match their sources. They are
      # committed because Pages deploys the repo as-is, which also means a stale
      # one ships silently: the tax page runs old code, a missing Tailwind class
      # just fails to style.
      - name: Generated files are current
        run: node tools/build-assets.mjs --check

      # A Tailwind class with no rule produces a layout break, not an error, so
      # nothing else catches it.
      - name: Tailwind coverage
        run: node tools/check-tailwind-coverage.mjs

      - name: Demo isolation
        run: node tests/demo-isolation.test.mjs

      # The AI endpoint spends money. Its gate is a Firebase signature check
      # plus a uid allowlist, and both are verified here against a real RS256
      # token minted in the test.
      - name: AI endpoint gate
        run: node tests/ai-endpoint.test.mjs

      # The deploy gate itself: SHELL_CACHE bump enforcement plus the proof
      # that activating a worker deletes only this app's caches.
      - name: Deploy gate
        run: node tests/deploy-gate.test.mjs

      # A shell change that keeps the old SHELL_CACHE leaves every returning
      # user on the previous bytes. This was a ::warning until now, and a
      # warning does not stop a merge.
      - name: Service worker cache bumped
        run: node tools/check-shell-bump.mjs HEAD~1

      # Cheap guards for the mistakes this repo has actually made, rather than a
      # general-purpose linter.
      - name: Repo invariants
        run: |
          fail=0

          # firebase-config.js is skip-worktree locally and carries dev-only
          # guards there. The committed copy must stay free of them.
          if grep -q 'ftLocalDev' firebase-config.js; then
            echo "::error file=firebase-config.js::local dev guards must not be committed"
            fail=1
          fi

          # tools/README.md marks these as local-run-only.
          for f in vite.config.js package.json; do
            if git diff --quiet HEAD~1 -- "$f" 2>/dev/null; then :; else
              echo "::warning file=$f::local-only file changed — see tools/README.md"
            fi
          done

          # The SHELL_CACHE bump is enforced by its own step above, which fails
          # rather than warns. It also compares the constant itself, not merely
          # whether sw.js was touched — a comment edit used to satisfy this.

          exit $fail
