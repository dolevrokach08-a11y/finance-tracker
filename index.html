<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ALLMON — מרכז השליטה הפיננסי</title>
    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <!--
      GitHub Pages serves this file at the site root, so it cannot simply be
      deleted — the bare URL would 404, and it is the address most likely to be
      bookmarked. It used to be a second home dashboard, which meant the app had
      two of them and which one you saw depended on how you arrived. Everything
      it offered now lives in the shell, so this redirects there instead.

      replace() rather than assignment: this page should not sit in history and
      send Back straight into another redirect.
    -->
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=app.html#/home">
    <link rel="canonical" href="app.html">
    <script>location.replace('app.html#/home');</script>
    <style>
        body {
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: #08090c;
            color: #898d98;
            font: 400 15px/1.6 Heebo, system-ui, sans-serif;
        }
        a { color: #c9ff47; }
    </style>
</head>
<body>
    <!-- Only reached if both the refresh and the script are blocked. -->
    <p>מעביר אותך אל ALLMON… <a href="app.html#/home">להמשך</a></p>
</body>
</html>
