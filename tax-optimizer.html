<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-base); color: var(--text-primary); min-height: 100vh; -webkit-font-smoothing: antialiased; }
input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 4px; outline: none; cursor: pointer; accent-color: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
a { color: var(--accent); }

/* Data banner */
.data-banner {
  margin: 12px 14px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.data-banner.success { background: hsla(142, 60%, 50%, 0.08); border: 1px solid hsla(142, 60%, 50%, 0.3); color: hsl(142, 40%, 70%); }
.data-banner.warning { background: hsla(38, 92%, 55%, 0.08); border: 1px solid hsla(38, 92%, 55%, 0.3); color: hsl(38, 92%, 55%); }
.data-banner.info { background: hsla(210, 80%, 55%, 0.08); border: 1px solid hsla(210, 80%, 55%, 0.3); color: hsl(210, 60%, 70%); }

/* Year selector */
.year-selector {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: hsl(220, 16%, 13%);
  border: 1px solid hsl(220, 14%, 16%);
  border-radius: 10px;
  padding: 6px 12px;
}
.year-selector select {
  background: hsl(220, 20%, 7%);
  border: 1px solid hsl(220, 14%, 16%);
  color: hsl(210, 20%, 92%);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}
.year-selector select option { background: hsl(220, 18%, 10%); }

/* Mobile rescue layer (Phase 4b #12 — this page had ZERO media queries).
   The app is React with inline styles, so grids are collapsed with !important. */
@media (max-width: 700px) {
  #root [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  #root table { display: block; overflow-x: auto; }
  .year-selector { flex-wrap: wrap; }
  .data-banner { margin: 10px 8px; }
}

    </section>

    <footer class="product-boot-signals" aria-label="שלבי טעינה"><span>PROFILE <i></i></span><span>RULES <i></i></span><span>SIMULATION <i></i></span></footer>

<!-- babel-standalone (~2.7MB) used to be the third tag here, transpiling 2,100+
     lines of JSX in the browser on every load. tax-optimizer.app.js is compiled
     ahead of time now, so it is gone. These two keep the UMD globals the
     compiled output calls (React.createElement / ReactDOM.render); defer holds
     document order, so they are ready before the app script runs. -->
<script src="vendor/react-18.2.0.production.min.js" defer></script>
<script src="vendor/react-dom-18.2.0.production.min.js" defer></script>
<!-- pdf.js and Tesseract are reachable only from the payslip file input, so they
     are fetched on first scan instead of on every page load. The old comment here
     claimed Tesseract was "loaded lazily" while it was in fact a blocking tag;
     now it actually is. FTLoad.pdfjs() also sets the pdf.js workerSrc. -->
<script src="shared/load-script.js"></script>

<!-- Firebase Auth & Data Loading -->
<script type="module">
  import { injectNav, setNavUser, injectDemoBanner } from './shared/nav.js';
  injectNav('tax');

  // Demo mode check
  let _isDemoMode = false;
  let _demoFinanceData = null;
  try {
    const demoModule = await import('./demo-data.js');
    _isDemoMode = demoModule.isDemoMode();
    if (_isDemoMode) {
      demoModule.ensureDemoStorageSandbox();
      _demoFinanceData = demoModule.generateDemoFinanceData();
    }
  } catch(e) { console.warn('Demo module not loaded:', e); }

  let auth, db, onAuthStateChanged, doc, getDoc, setDoc;
  if (!_isDemoMode) {
    const fb = await import('./firebase-config.js');
    auth = fb.auth; db = fb.db; onAuthStateChanged = fb.onAuthStateChanged;
    doc = fb.doc; getDoc = fb.getDoc; setDoc = fb.setDoc;
  }

  window.__taxData = { loaded: false, years: {}, availableYears: [] };
  window.__taxSettings = null;
  window.__payslipData = { payslips: [], loaded: false };
  window.__financeDocRef = null;
  window.__financeData = null;

  // Initialize sync widget. We share the same metaKey as finance.html
  // because tax-optimizer writes to the SAME finance/data document.
  if (window.SyncWidget) {
    window.SyncWidget.init({
      containerId: 'syncWidgetSlot',
      metaKey: 'financeTrackerData_meta',
      isDemoMode: () => _isDemoMode,
      onForceSync: async () => {
        // Re-save current finance data + tax settings to push any pending writes
        if (window.__financeDocRef && window.__financeData) {
          await setDoc(window.__financeDocRef, { ...window.__financeData, lastModified: new Date().toISOString(),
            ...(window.FTDevice ? window.FTDevice.stamp() : {}) });
        }
        if (window.__pendingTaxSettings) {
          await window.__saveTaxSettings(window.__pendingTaxSettings);
        }
      }
    });
  }

  function _markSyncing() { if (window.SyncWidget) window.SyncWidget.markSyncing(); }
  function _markSynced(ts) { if (window.SyncWidget) window.SyncWidget.markSynced(ts); }
  function _markError() { if (window.SyncWidget) window.SyncWidget.markError(); }
  function _markPending() { if (window.SyncWidget) window.SyncWidget.markPending(); }

  // Save settings to Firebase
  window.__saveTaxSettings = async (settings) => {
    if (_isDemoMode) return;
    const user = auth.currentUser;
    if (!user) return;
    window.__pendingTaxSettings = settings;
    if (!navigator.onLine) { _markPending(); return; }
    _markSyncing();
    try {
      const ref = doc(db, 'users', user.uid, 'finance', 'taxSettings');
      const ts = new Date().toISOString();
      await setDoc(ref, { ...settings, lastModified: ts });
      _markSynced(ts);
    } catch (e) {
      console.error('Failed to save tax settings:', e);
      _markError();
    }
  };

  // Save payslip to Firebase (into finance/data document)
  window.__savePayslip = async (payslip) => {
    if (_isDemoMode) return false;
    if (!window.__financeDocRef) return false;
    const data = window.__financeData || { transactions: [], fixedIncomes: [], fixedExpenses: [], donations: [], payslips: [], incomeCategories: [], expenseCategories: [], categoryRules: [], budgets: {} };
    if (!data.payslips) data.payslips = [];

    // A payslip's identity is month + earner + source + fileName. Re-uploading the
    // same file replaces its entry; a second employer's payslip for the same month
    // is a different file, so it is kept alongside the first. (Until 2026-08-23 the
    // key for regular payslips was month + earner alone, so every extra payslip in
    // a month silently overwrote the previous one — and the yearly average, which
    // sums per month, only ever saw one employer.)
    // Hand-typed entries carry no real file name, so they never replace anything —
    // each one is its own row and is removed with the delete button.
    if (payslip.source !== 'manual') {
      data.payslips = data.payslips.filter(p =>
        !(p.month === payslip.month &&
          p.earner === payslip.earner &&
          (p.source || '') === (payslip.source || '') &&
          p.fileName === payslip.fileName)
      );
    }
    data.payslips.push(payslip);

    if (!navigator.onLine) {
      window.__financeData = data;
      window.__payslipData = { payslips: data.payslips, loaded: true };
      _markPending();
      return true;
    }

    _markSyncing();
    try {
      const ts = new Date().toISOString();
      await setDoc(window.__financeDocRef, { ...data, lastModified: ts,
        ...(window.FTDevice ? window.FTDevice.stamp() : {}) });
      window.__financeData = data;
      window.__payslipData = { payslips: data.payslips, loaded: true };
      _markSynced(ts);
      return true;
    } catch (e) {
      console.error('Failed to save payslip:', e);
      _markError();
      return false;
    }
  };

  // Delete payslip from Firebase
  window.__deletePayslip = async (payslipId) => {
    if (_isDemoMode) return false;
    if (!window.__financeDocRef || !window.__financeData) return false;
    const data = window.__financeData;
    data.payslips = (data.payslips || []).filter(p => p.id !== payslipId);

    if (!navigator.onLine) {
      window.__financeData = data;
      window.__payslipData = { payslips: data.payslips, loaded: true };
      _markPending();
      return true;
    }

    _markSyncing();
    try {
      const ts = new Date().toISOString();
      await setDoc(window.__financeDocRef, { ...data, lastModified: ts,
        ...(window.FTDevice ? window.FTDevice.stamp() : {}) });
      window.__financeData = data;
      window.__payslipData = { payslips: data.payslips, loaded: true };
      _markSynced(ts);
      return true;
    } catch (e) {
      console.error('Failed to delete payslip:', e);
      _markError();
      return false;
    }
  };

  // Process income data for tax analysis
  function processIncomeData(transactions, fixedIncomes) {
    const yearMap = {};

    function shiftMonthBack(trackerMonth) {
      const [y, m] = trackerMonth.split('-').map(Number);
      if (m === 1) return `${y - 1}-12`;
      return `${y}-${String(m - 1).padStart(2, '0')}`;
    }

    function addToYearMap(taxMonth, amt, earner) {
      const taxYear = taxMonth.substring(0, 4);
      const taxMM = taxMonth.substring(5, 7);
      if (!yearMap[taxYear]) yearMap[taxYear] = { months: new Set(), father: 0, mother: 0, untagged: 0, total: 0, monthlyFather: {}, monthlyMother: {}, monthlyUntagged: {} };
      yearMap[taxYear].months.add(taxMM);
      yearMap[taxYear].total += amt;
      if (earner === 'father') {
        yearMap[taxYear].father += amt;
        yearMap[taxYear].monthlyFather[taxMM] = (yearMap[taxYear].monthlyFather[taxMM] || 0) + amt;
      } else if (earner === 'mother') {
        yearMap[taxYear].mother += amt;
        yearMap[taxYear].monthlyMother[taxMM] = (yearMap[taxYear].monthlyMother[taxMM] || 0) + amt;
      } else {
        yearMap[taxYear].untagged += amt;
        yearMap[taxYear].monthlyUntagged[taxMM] = (yearMap[taxYear].monthlyUntagged[taxMM] || 0) + amt;
      }
    }

    transactions.forEach(t => {
      if (t.type !== 'income' || !t.month) return;
      const taxMonth = shiftMonthBack(t.month);
      addToYearMap(taxMonth, t.amount || t.amt || 0, t.earner || null);
    });

    fixedIncomes.forEach(f => {
      if (!f.start || !f.end) return;
      let cur = f.start;
      while (cur <= f.end) {
        const taxMonth = shiftMonthBack(cur);
        addToYearMap(taxMonth, f.amount || 0, f.earner || null);
        const [y, m] = cur.split('-').map(Number);
        const nextMonth = m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, '0')}`;
        cur = nextMonth;
      }
    });

    const years = {};
    for (const [year, info] of Object.entries(yearMap)) {
      const monthCount = info.months.size;
      const isComplete = monthCount === 12;
      const fatherMonthly = monthCount > 0 ? Math.round(info.father / monthCount) : 0;
      const motherMonthly = monthCount > 0 ? Math.round(info.mother / monthCount) : 0;
      const untaggedMonthly = monthCount > 0 ? Math.round(info.untagged / monthCount) : 0;

      years[year] = {
        monthCount, isComplete, fatherMonthly, motherMonthly, untaggedMonthly,
        totalAnnual: info.total, fatherAnnual: info.father, motherAnnual: info.mother, untaggedAnnual: info.untagged
      };
    }

    return { years, availableYears: Object.keys(years).sort().reverse() };
  }

  if (_isDemoMode) {
    // Demo mode - use fictitious data
    const demoUser = (await import('./demo-data.js')).getDemoUser();
    setNavUser(demoUser);

    const transactions = _demoFinanceData.transactions || [];
    const fixedIncomes = _demoFinanceData.fixedIncomes || [];
    const result = processIncomeData(transactions, fixedIncomes);
    window.__taxData = { loaded: true, years: result.years, availableYears: result.availableYears };

    injectDemoBanner(); // unified banner under the shared nav (Phase 4b #14)

    const root = document.getElementById('root');
    const loading = document.getElementById('auth-loading');
    loading.style.display = 'none';
    root.style.display = 'block';
    // The compiled app script is deferred, so it may not have run yet. Whichever
    // of the two arrives second does the mount — see the tail of tax-optimizer.src.jsx.
    window.__appReady = true;
    if (window.__renderApp) window.__renderApp();
  } else {
    onAuthStateChanged(auth, async (user) => {
      const loading = document.getElementById('auth-loading');
      const root = document.getElementById('root');

      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      if (window.UserStorage) window.UserStorage.syncToUser(user.uid); // isolate localStorage to this uid

      // Show user in nav
      setNavUser(user);

      // Both documents are fetched before either is awaited. They used to be two
      // sequential round trips gating first paint, and with
      // experimentalForceLongPolling each one is a real RTT. allSettled (not all)
      // keeps the two independent failure paths below behaving as they did.
      const userDocRef = doc(db, 'users', user.uid, 'finance', 'data');
      window.__financeDocRef = userDocRef;

      // Read the two documents ONE AT A TIME, not concurrently.
      //
      // These were briefly fired together to save a round trip. That was reverted:
      // this page has no localStorage fallback, so if the reads fail it renders as
      // though the user has no payslips and no tax years — which reads as data
      // loss. Saving one RTT is not worth any added risk to that, and a cold
      // long-polling connection is more likely to carry a second read once the
      // first has established it.
      //
      // Still time-boxed: Firestore under experimentalForceLongPolling does not
      // reliably reject when it cannot reach the backend, and an unbounded await
      // left #root hidden forever.
      const withTimeout = p => Promise.race([
        p,
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Firestore timeout')), 15000))
      ]);
      const settle = async p => {
        try { return { status: 'fulfilled', value: await p }; }
        catch (reason) { return { status: 'rejected', reason }; }
      };
      const financeResult = await settle(withTimeout(getDoc(userDocRef)));
      const settingsResult = await settle(withTimeout(getDoc(doc(db, 'users', user.uid, 'finance', 'taxSettings'))));

      // Load finance data from Firebase
      try {
        if (financeResult.status === 'rejected') throw financeResult.reason;
        const docSnap = financeResult.value;

        if (docSnap.exists()) {
          const data = docSnap.data();
          window.__financeData = data;
          window.__payslipData = { payslips: data.payslips || [], loaded: true };
          document.dispatchEvent(new CustomEvent('payslipDataLoaded'));
          // Portfolio data for CPI tax simulator
          window.__portfolioHoldings = data.holdings || [];
          window.__portfolioPurchases = data.purchases || [];
          window.__portfolioSales     = data.sales    || [];
          window.__portfolioRates     = data.rates    || { USD: 3.6, EUR: 3.9 };
          const transactions = data.transactions || [];
          const fixedIncomes = data.fixedIncomes || [];

          const result = processIncomeData(transactions, fixedIncomes);
          window.__taxData = { loaded: true, years: result.years, availableYears: result.availableYears };
          if (window.SyncWidget) window.SyncWidget.markLoadedFromCloud(data.lastModified || null);
        } else {
          if (window.SyncWidget) window.SyncWidget.markLocalOnly();
        }
      } catch (e) {
        console.error('Failed to load finance data:', e);
        if (window.SyncWidget) window.SyncWidget.markError();

        // Say so, loudly. This page reads only from Firestore — there is no local
        // copy to fall back on — so a failed read renders an empty calculator with
        // no tax years and no payslips, which looks exactly like the data being
        // gone. It is not: it is still in Firestore, unread. Never let a load
        // failure masquerade as an empty account.
        const banner = document.createElement('div');
        banner.className = 'data-banner warning';
        banner.style.cssText = 'margin:12px 14px;justify-content:space-between';
        const msg = document.createElement('span');
        msg.textContent = '⚠️ לא הצלחנו לטעון את הנתונים מהענן. התלושים ושנות המס שלך שמורים — הם פשוט לא נקראו. נסה לרענן.';
        const retry = document.createElement('button');
        retry.textContent = 'רענן';
        retry.style.cssText = 'background:var(--accent,#3b82f6);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12px';
        retry.addEventListener('click', () => location.reload());
        banner.append(msg, retry);
        document.getElementById('root').before(banner);
      }

      // Load saved tax optimizer settings
      try {
        if (settingsResult.status === 'rejected') throw settingsResult.reason;
        const settingsSnap = settingsResult.value;
        if (settingsSnap.exists()) {
          window.__taxSettings = settingsSnap.data();
        }
      } catch (e) {
        console.error('Failed to load tax settings:', e);
      }

      // Show app
      loading.style.display = 'none';
      root.style.display = 'block';

      // Trigger React render
      window.__appReady = true;
      if (window.__renderApp) window.__renderApp();
    });
  }
</script>

<!-- Compiled from tax-optimizer.src.jsx by tools/build-assets.mjs.
     babel-standalone (~2.7MB) used to sit above this and transpile 2,100+
     lines of JSX in the browser on every single page load. defer keeps this
     after React and ReactDOM, which are deferred too — deferred scripts run
     in document order. EDIT THE .src.jsx, NOT THE GENERATED FILE. -->
<script src="tax-optimizer.app.js" defer></script>
</body>
